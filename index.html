<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>こちゃ — のぞき見SNS テスト版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 曇天の午後、窓ガラス越しの光。色は「霧」を基調に、紫陽花をひとさじ */
  --mist:#D3D9DF;
  --mist-2:#C4CCD4;
  --mist-3:#B4BEC8;
  --ink:#1E2731;
  --ink-2:#44505C;
  --dull:#707C88;
  --faint:#97A2AD;
  --line:rgba(38,48,59,.08);
  --hydra:#7980B4;      /* 紫陽花：主要な操作 */
  --hydra-d:#596093;
  --hydra-l:#D5D8EA;
  --lamp:#EFBFA2;       /* 灯：ぬくもり・未読 */
  --glass:rgba(236,240,244,.62);
  --glass-2:rgba(255,255,255,.42);
  --g-m:#8FD3EC; --g-f:#F4A9C4; --g-o:#9AD8B0;
  --sans:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
  --mincho:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
  --ease-out:cubic-bezier(.22,.8,.24,1);
  --ease-soft:cubic-bezier(.4,.1,.2,1);
  --nav-h:74px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.6;
  background:#262D36 radial-gradient(120% 80% at 50% 0%,#3A434E 0%,#1D232A 100%);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hydra);outline-offset:2px;border-radius:10px}

/* ---------- 端末フレーム ---------- */
#phone{
  position:relative;width:400px;height:min(860px,calc(100dvh - 32px));
  border-radius:46px;overflow:hidden;isolation:isolate;
  background:var(--mist);
  box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 40px 90px -30px rgba(0,0,0,.6),0 0 0 10px rgba(255,255,255,.06);
}
@media (max-width:520px){
  body{display:block}
  #phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
}
#deskNote{
  position:fixed;left:28px;bottom:24px;max-width:260px;font-size:12px;color:rgba(214,222,230,.62);line-height:1.7;
}
#deskNote b{font-family:var(--mincho);font-weight:500;font-size:20px;display:block;color:#DDE3E9;margin-bottom:4px;letter-spacing:.08em}
@media (max-width:900px){#deskNote{display:none}}

/* ---------- 空気（背景） ---------- */
.sky{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:linear-gradient(180deg,#46505C 0%,#5C6774 30%,#7A8591 62%,#949EA8 100%)}
.sky::after{ /* 窓ガラスを伝う、ほとんど見えない筋 */
  content:"";position:absolute;inset:-20% 0 0;opacity:.5;
  background:repeating-linear-gradient(93deg,transparent 0 37px,rgba(255,255,255,.07) 37px 38px,transparent 38px 91px,rgba(255,255,255,.035) 91px 92px,transparent 92px 143px,rgba(20,28,38,.05) 143px 144px);
  mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.6) 55%,transparent 90%);
}
.bokeh{position:absolute;border-radius:50%;filter:blur(30px);opacity:.38;mix-blend-mode:screen;animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(14px,26px,0) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.bokeh,.orb::before{animation:none!important}}

/* ---------- 画面 ---------- */
.screen{position:absolute;inset:0;z-index:1;display:none}
.screen.on{display:block}
#scr-chats,#scr-me{background:linear-gradient(180deg,rgba(74,85,98,.0) 0%,rgba(190,198,207,.0) 1px),linear-gradient(180deg,#B5BEC8 0%,#C8CFD6 30%,#D3D9DE 100%)}
#scr-chats h1.title,#scr-me h1.title{color:var(--ink)}
.scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--safe-t) + 18px) 18px calc(var(--nav-h) + 40px)}
.scroll::-webkit-scrollbar{width:0}

.topbar{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:flex-start;justify-content:space-between;
  padding:calc(var(--safe-t) + 18px) 18px 26px;pointer-events:none;
  background:linear-gradient(180deg,rgba(66,76,88,.9) 0%,rgba(66,76,88,.5) 60%,rgba(66,76,88,0) 100%)}
.topbar > *{pointer-events:auto}
.wordmark{font-family:var(--mincho);font-weight:500;font-size:26px;letter-spacing:.14em;line-height:1;color:#ECEFF2;text-shadow:0 1px 12px rgba(20,28,38,.35)}
.wordmark small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.04em;color:rgba(226,232,238,.66);text-shadow:none;margin-top:8px;font-weight:400}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass);color:var(--ink);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 0 0 1px rgba(255,255,255,.7) inset,0 4px 14px -6px rgba(40,55,75,.25)}
.iconbtn svg{width:19px;height:19px}
.iconbtn.spin svg{animation:spin .9s var(--ease-soft)}
@keyframes spin{to{transform:rotate(360deg)}}

h1.title{font-family:var(--mincho);font-weight:500;font-size:24px;letter-spacing:.08em;margin:6px 0 18px}
h2.sec{font-size:13px;font-weight:500;color:var(--dull);margin:26px 2px 10px;letter-spacing:.04em}

/* ---------- ワールド ---------- */
.world{position:absolute;inset:0;touch-action:none;cursor:grab}
.world canvas{position:absolute;inset:0;width:100%;height:100%}
.world.dragging{cursor:grabbing}
.pull{position:absolute;left:50%;top:calc(var(--safe-t) + 70px);transform:translate(-50%,-30px);opacity:0;z-index:4;
  font-size:12px;color:var(--ink-2);background:var(--glass);backdrop-filter:blur(10px);padding:6px 14px;border-radius:99px;pointer-events:none;transition:opacity .2s}
.backtop{position:absolute;left:50%;top:calc(var(--safe-t) + 74px);transform:translateX(-50%);z-index:4;font-size:12px;padding:7px 15px;border-radius:99px;
  background:var(--glass);backdrop-filter:blur(12px);box-shadow:0 0 0 1px rgba(255,255,255,.7) inset,0 6px 16px -8px rgba(40,55,75,.3);display:none}
.backtop.on{display:block}
.hint{position:absolute;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 26px);transform:translateX(-50%);z-index:4;white-space:nowrap;
  font-size:12px;color:var(--ink-2);padding:8px 10px 8px 16px;border-radius:99px;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);
  display:flex;gap:6px;align-items:center;box-shadow:0 8px 20px -12px rgba(40,55,75,.35)}
.hint button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--dull)}
.empty-world{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:rgba(226,232,238,.7);font-size:13px;padding:40px;z-index:2;pointer-events:none}
.empty-world b{display:block;font-family:var(--mincho);font-weight:500;color:#E6EAEE;font-size:17px;margin-bottom:6px}

.follow-strip{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 66px);z-index:6;display:flex;gap:14px;overflow-x:auto;padding:4px 18px 10px}
.follow-strip::-webkit-scrollbar{height:0}
.follow-strip button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:rgba(232,237,242,.85);flex:none}

/* ---------- ナビ ---------- */
nav.tabs{position:absolute;left:12px;right:12px;bottom:calc(10px + var(--safe-b));height:var(--nav-h);z-index:30;
  display:grid;grid-template-columns:1fr 1fr 92px 1fr 1fr;align-items:center;
  border-radius:30px;background:rgba(222,228,234,.82);backdrop-filter:blur(22px) saturate(1.1);-webkit-backdrop-filter:blur(22px) saturate(1.2);
  box-shadow:0 0 0 1px rgba(255,255,255,.55) inset,0 18px 40px -16px rgba(10,16,24,.55)}
nav.tabs > button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--dull);padding:8px 0;position:relative;letter-spacing:.02em}
nav.tabs > button svg{width:23px;height:23px}
nav.tabs > button.on{color:var(--ink)}
nav.tabs > button .dot{position:absolute;top:7px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 2px rgba(248,250,251,.9)}

/* 水晶玉 */
.orb-wrap{position:relative;height:100%}
.orb-btn{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:76px;height:96px;display:flex;flex-direction:column;align-items:center}
.orb{position:relative;width:66px;height:66px;border-radius:50%;overflow:hidden;
  background:
    radial-gradient(circle at 34% 28%,rgba(255,255,255,.95) 0 7%,rgba(255,255,255,0) 22%),
    radial-gradient(circle at 70% 82%,rgba(255,255,255,.55),rgba(255,255,255,0) 38%),
    radial-gradient(circle at 50% 55%,rgba(214,220,246,.55),rgba(160,170,214,.75) 70%,rgba(120,128,180,.9) 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.75) inset,0 -6px 14px rgba(110,118,179,.25) inset,0 12px 26px -8px rgba(100,108,168,.6),0 0 30px -6px rgba(180,190,240,.8);
  transition:transform .35s var(--ease-out)}
.orb::before{content:"";position:absolute;inset:-30%;border-radius:50%;opacity:.75;mix-blend-mode:screen;filter:blur(7px);
  background:conic-gradient(from 0deg,rgba(255,255,255,0),rgba(244,169,196,.55),rgba(255,255,255,0) 35%,rgba(143,211,236,.6),rgba(255,255,255,0) 70%,rgba(154,216,176,.45),rgba(255,255,255,0));
  animation:orbspin 14s linear infinite}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.9),rgba(255,255,255,0) 18%)}
@keyframes orbspin{to{transform:rotate(360deg)}}
.orb-stand{width:44px;height:11px;margin-top:-5px;border-radius:0 0 22px 22px/0 0 11px 11px;
  background:linear-gradient(180deg,#A9B0BE,#7E8696);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 4px 8px -3px rgba(40,55,75,.4);position:relative;z-index:-1}
.orb-btn span{font-size:10.5px;color:var(--ink-2);margin-top:3px;letter-spacing:.1em}
.orb-btn:active .orb{transform:scale(.92)}
.orb-btn:hover .orb{transform:translateY(-2px)}

/* ---------- 共通部品 ---------- */
.avatar{width:var(--s,40px);height:var(--s,40px);border-radius:50%;flex:none;display:grid;place-items:center;position:relative;
  font-family:var(--mincho);font-weight:500;font-size:calc(var(--s,40px)*.42);color:#fff;
  box-shadow:0 0 0 1.5px var(--gc,transparent),0 0 0 3.5px rgba(255,255,255,.9)}
.pair{display:flex;flex:none}
.pair .avatar:last-child{margin-left:-12px}
.card{background:var(--glass);border-radius:22px;box-shadow:0 0 0 1px rgba(255,255,255,.75) inset,0 10px 30px -22px rgba(40,55,75,.4);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:99px;font-weight:500;font-size:15px;
  background:var(--ink);color:#fff;transition:transform .2s var(--ease-out),opacity .2s;letter-spacing:.02em}
.btn:active{transform:scale(.97)}
.btn.hydra{background:linear-gradient(180deg,#8189BD,#646B9E);box-shadow:0 10px 24px -12px rgba(100,108,168,.9),0 1px 0 rgba(255,255,255,.35) inset}
.btn.ghost{background:rgba(255,255,255,.7);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
.btn.small{height:36px;padding:0 15px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.42;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.7);color:var(--ink-2);box-shadow:0 0 0 1px var(--line) inset}
.muted{color:var(--dull)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
svg.i{width:18px;height:18px;flex:none}

/* ---------- 一覧 ---------- */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:13px;padding:13px 6px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .name{font-weight:500;font-size:14.5px}
.item .sub{font-size:13px;color:var(--ink-2)}
.item .meta{font-size:11.5px;color:var(--dull);text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.badge-paused{font-size:10.5px;padding:1px 8px;border-radius:99px;background:var(--mist-2);color:var(--dull)}
.unread{width:8px;height:8px;border-radius:50%;background:var(--lamp)}

/* ---------- シート・ページ ---------- */
.layer{position:absolute;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:rgba(18,24,32,.38);opacity:0;transition:opacity .35s}
.layer.in .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(226,231,236,.97),rgba(211,217,223,.98));border-radius:30px 30px 0 0;
  box-shadow:0 -20px 50px -20px rgba(40,55,75,.35),0 0 0 1px rgba(255,255,255,.8) inset;
  transform:translateY(100%);transition:transform .45s var(--ease-out)}
.layer.in .sheet{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--faint);margin:10px auto 0;flex:none}
.sheet .body{overflow-y:auto;padding:8px 20px calc(24px + var(--safe-b))}
.page{position:absolute;inset:0;background:linear-gradient(180deg,#C6CED6 0%,#D3D9DF 55%,#DADFE4 100%);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .42s var(--ease-out);
  box-shadow:-20px 0 40px -20px rgba(40,55,75,.3)}
.layer.in .page{transform:none}
.pagehead{flex:none;display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 12px) 12px 10px;
  background:rgba(206,213,220,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);position:relative;z-index:2}
.pagehead .t{font-weight:500;font-size:15px;line-height:1.3}
.pagehead .s{font-size:11.5px;color:var(--dull)}
.pagebody{flex:1;overflow-y:auto;position:relative}
.pagebody::-webkit-scrollbar,.sheet .body::-webkit-scrollbar{width:0}
.back{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.back svg{width:22px;height:22px}

/* ---------- 玉の詳細 ---------- */
.ball-hero{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px}
.ball-hero canvas{animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.reveal{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:8px;border-radius:20px;background:rgba(255,255,255,.6);width:100%;text-align:left;
  animation:reveal .7s var(--ease-out) both .15s}
@keyframes reveal{from{opacity:0;filter:blur(6px);transform:translateY(6px)}}
.post{padding:16px 18px;margin-top:12px}
.post p{margin:0 0 10px;font-size:15px;line-height:1.85;white-space:pre-wrap}
.post .foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--dull)}
.like{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);padding:4px 8px;margin:-4px -8px;border-radius:99px}
.like svg{width:19px;height:19px;transition:transform .3s var(--ease-out)}
.like.on{color:var(--hydra-d)}
.like.on svg{transform:scale(1.12)}
.sendcap{font-size:12px;color:var(--dull);text-align:center;margin-top:8px}
.locktag{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2)}

/* ---------- トーク ---------- */
.talk{padding:14px 14px 20px;display:flex;flex-direction:column;gap:4px}
.seg{display:flex;flex-direction:column;align-items:center;gap:4px;margin:22px 0 14px;color:var(--dull);font-size:11px}
.seg .w{display:flex;align-items:center;gap:8px;font-family:var(--mincho);font-size:15px;color:var(--ink);letter-spacing:.06em}
.seg .w i{width:14px;height:14px;border-radius:50%;display:block;box-shadow:0 0 0 1.5px var(--gc) inset,0 2px 6px -2px rgba(40,55,75,.4)}
.seg::before{content:"";width:1px;height:18px;background:linear-gradient(180deg,transparent,var(--faint))}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:84%}
.msg .who{font-size:10.5px;color:var(--dull);margin:0 4px 2px}
.msg .bub{padding:9px 14px;border-radius:20px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
  background:rgba(244,246,248,.86);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 4px 12px -8px rgba(40,55,75,.3)}
.msg .tm{font-size:10px;color:var(--faint);flex:none;margin-bottom:3px}
.msg.l{align-self:flex-start}
.msg.r{align-self:flex-end;flex-direction:row-reverse}
.msg.r .bub{background:linear-gradient(180deg,#7E86B8,#666D9F);color:#fff;box-shadow:0 6px 16px -10px rgba(100,108,168,.9)}
.msg.peek.r .bub{background:rgba(196,201,224,.92);color:var(--ink)}
.msg.locked .bub{box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 4px 12px -8px rgba(40,55,75,.3)}
.msg .lk{width:12px;height:12px;opacity:.55;flex:none;margin-bottom:5px}
.lockline{align-self:center;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dull);margin:10px 0}
.lockblock{align-self:stretch;margin:10px 4px;border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 8px,rgba(255,255,255,.35) 8px 16px);
  box-shadow:0 0 0 1px rgba(255,255,255,.8) inset,0 8px 24px -16px rgba(40,55,75,.45);backdrop-filter:blur(6px)}
.lockblock .lt{font-weight:500;font-size:14px;white-space:nowrap}
.lockblock .ls{font-size:12px;color:var(--dull)}
.lockblock .lic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.75);flex:none}
.lockblock .lic svg{width:24px;height:24px}
.opened{align-self:stretch;display:flex;flex-direction:column;gap:4px;margin:8px 0;padding:10px 8px 12px;border-radius:22px;background:rgba(255,255,255,.28);box-shadow:0 0 0 1px rgba(201,178,122,.45) inset}
.opened .oh{align-self:center;font-size:11px;color:var(--ink-2);display:flex;gap:5px;align-items:center;margin-bottom:6px}
.limit-note{align-self:center;font-size:11.5px;color:var(--dull);padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.5);margin:6px 0}
.typing{align-self:flex-start;padding:10px 14px;border-radius:20px;background:rgba(255,255,255,.82);display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:typ 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes typ{30%{transform:translateY(-3px);background:var(--dull)}}
.msg.new{animation:msgin .45s var(--ease-out)}
@keyframes msgin{from{opacity:0;transform:translateY(8px)}}

.inputbar{flex:none;display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(12px + var(--safe-b));background:rgba(206,213,220,.9);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.inputbar textarea{flex:1;resize:none;border:0;outline:0;border-radius:22px;padding:10px 16px;background:#fff;min-height:42px;max-height:120px;line-height:1.5;font-size:15px;box-shadow:0 0 0 1px var(--line) inset}
.inputbar .iconbtn{flex:none;width:42px;height:42px}
.send{background:var(--ink)!important;color:#fff}
.lockstate{flex:none;display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;color:var(--ink-2);padding:7px 12px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.7),rgba(255,255,255,0))}

.gpick{display:flex;gap:8px;margin-top:8px}

    return t;
  }
  targetCam() { return Math.min(this.baseCam(), this.pileTop(false) - this.H * .3); }
  mk(ball) { const r = CONFIG.radius(ball.pt); return { ball, r, m: r * r, x: 0, y: 0, px: 0, py: 0, falling: false, pulse: 0 }; }
  /* 5分より前の玉は積もった状態で、それ以降の玉は上から降らせる */
  build(animateRecent = true) {
    if (!this.W) { this.pendingBuild = true; return; }
    this.built = true;
    const list = S.balls.filter(this.opts.filter).sort((a, b) => a.at - b.at);
    const t = now();
    const old = animateRecent ? list.filter(b => seenBallIds.has(b.id) || t - b.at > CONFIG.recentFallMs) : list;
    const recent = animateRecent ? list.filter(b => !seenBallIds.has(b.id) && t - b.at <= CONFIG.recentFallMs) : [];
    rememberSeenBalls(list);
    this.bodies = []; this.drops = []; this.ripples = [];
    old.forEach((ball, i) => {
      const b = this.mk(ball), h = hash(ball.id);
      b.x = b.r + (h % 1000) / 1000 * (this.W - 2 * b.r);
      b.y = this.pileTop(true) - b.r - 6 - (h >> 10) % 30;
      b.px = b.x; b.py = b.y; this.bodies.push(b);
      if (i % 3 === 2) for (let k = 0; k < 70; k++) this.step(3);
    });
    for (let k = 0; k < 260; k++) this.step(4);
    this.bodies.forEach(b => { b.px = b.x; b.py = b.y; });
    this.camY = this.targetCam(); this.off = 0;
    const startAt = performance.now() + 500;
    recent.forEach((ball, i) => this.drops.push({ ball, at: startAt + i * 380 }));
    this.updateUI();
    this.wake();
    this.opts.onBuilt && this.opts.onBuilt(list.length);
  }
  step(iter = 4) {
    const B = this.bodies, n = B.length, W = this.W;
    for (const b of B) {
      const vx = (b.x - b.px) * this.damp, vy = (b.y - b.py) * this.damp;
      b.px = b.x; b.py = b.y; b.x += vx; b.y += vy + this.G; b.hit = false;
    }
    for (let k = 0; k < iter; k++) {
      for (let i = 0; i < n; i++) {
        const a = B[i];
        for (let j = i + 1; j < n; j++) {
          const c = B[j], min = a.r + c.r;
          const dy = c.y - a.y; if (dy > min || dy < -min) continue;
          const dx = c.x - a.x; if (dx > min || dx < -min) continue;
          const d2 = dx * dx + dy * dy; if (d2 >= min * min) continue;
          const d = Math.sqrt(d2) || .01, ov = (min - d) / d, ta = c.m / (a.m + c.m), tc = a.m / (a.m + c.m);
          a.x -= dx * ov * ta; a.y -= dy * ov * ta; c.x += dx * ov * tc; c.y += dy * ov * tc;
          a.hit = c.hit = true;
          if (a.falling || c.falling) this.land(a.falling ? a : c, a.falling ? c : a);
        }
      }
      for (const b of B) {
        if (b.x < b.r) b.x = b.r; else if (b.x > W - b.r) b.x = W - b.r;
        if (b.y > -b.r) { b.y = -b.r; b.hit = true; if (b.falling) this.land(b, null); }
      }
    }
    for (const b of B) if (b.hit) { b.px += (b.x - b.px) * .1; b.py += (b.y - b.py) * .04; }
  }
  land(b, other) {
    const speed = b.y - b.py; b.falling = false;
    if (speed > 1.5 && this.visible) this.ripples.push({ x: b.x, y: b.y + b.r * .92, r: b.r, t: performance.now() });
  }
  drop(ball) {
    const b = this.mk(ball);
    b.x = b.r + Math.random() * (this.W - 2 * b.r);
    b.y = this.camY + this.off - b.r - 12; b.px = b.x + (Math.random() - .5) * .8; b.py = b.y - 2;
    b.falling = true; this.bodies.push(b);
  }
  wake() { this.idle = 0; if (!this.running && this.visible) { this.running = true; requestAnimationFrame(t => this.frame(t)); } }
  setVisible(v) { this.visible = v; if (v) { if (this.pendingBuild) { this.pendingBuild = false; this.build(); } this.wake(); } }
  frame(t) {
    if (!this.visible) { this.running = false; return; }
    const pt = performance.now();
    while (this.drops.length && this.drops[0].at <= pt) this.drop(this.drops.shift().ball);
    this.step(4);
    const tc = this.targetCam(); this.camY += (tc - this.camY) * .045;
    if (!this.dragging) { const maxOff = this.baseCam() - this.camY; if (this.off > maxOff) this.off += (maxOff - this.off) * .2; if (this.off < 0) this.off *= .7; }
    this.draw(pt);
    let moving = this.drops.length > 0 || this.ripples.length > 0 || this.dragging || Math.abs(tc - this.camY) > .4;
    if (!moving) for (const b of this.bodies) { if (Math.abs(b.y - b.py) > .03 || Math.abs(b.x - b.px) > .03 || b.pulse) { moving = true; break; } }
    this.idle = moving ? 0 : this.idle + 1;
    if (this.idle > 40) { this.running = false; return; }
    requestAnimationFrame(t2 => this.frame(t2));
  }
  draw(pt) {
    const ctx = this.ctx, dpr = this.dpr, cam = this.camY + this.off;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, this.W, this.H);
    // 地面のかすかな光だまり
    const fy = -cam;
    if (fy < this.H + 40) {
      const g = ctx.createLinearGradient(0, fy - 60, 0, fy + 10); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,.16)');
      ctx.fillStyle = g; ctx.fillRect(0, fy - 60, this.W, 70);
    }
    // 波紋（雨だまりにひとつぶ落ちたような）
    this.ripples = this.ripples.filter(rp => pt - rp.t < 1100);
    for (const rp of this.ripples) {
      const k = (pt - rp.t) / 1100, e = 1 - (1 - k) ** 3;
      for (let i = 0; i < 2; i++) {
        const kk = clamp(e - i * .18, 0, 1); if (kk <= 0) continue;
        ctx.beginPath(); ctx.ellipse(rp.x, rp.y - cam, rp.r * (.5 + kk * 1.3), rp.r * (.12 + kk * .3), 0, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(235,240,246,${(1 - kk) * .5})`; ctx.lineWidth = 1.2; ctx.stroke();
      }
    }
    for (const b of this.bodies) {
      const sy = b.y - cam; if (sy + b.r * 1.7 < 0 || sy - b.r * 1.7 > this.H) continue;
      const sp = ballSprite(b.ball, b.r, dpr), sz = sp._size;
      let s = 1;
      if (b.pulse) { const k = (pt - b.pulse) / 360; if (k >= 1) b.pulse = 0; else s = 1 + Math.sin(k * Math.PI) * .07; }
      ctx.drawImage(sp, b.x - sz * s / 2, sy - sz * s / 2, sz * s, sz * s);
    }
    this.updateUI();
  }
  updateUI() {
    const o = this.opts;
    if (o.backEl) o.backEl.classList.toggle('on', this.off > 60);
    if (o.pullEl) {
      const p = this.dragging && this.off < 0 ? -this.off : 0;
      o.pullEl.style.opacity = clamp(p / 50, 0, 1);
      o.pullEl.style.transform = `translate(-50%,${-30 + Math.min(p, 80) * .5}px)`;
      o.pullEl.textContent = p > 70 ? 'はなすと更新' : '引っぱって更新';
    }
  }
  toTop() { this.off = 0; this.wake(); }
  hit(sx, sy) {
    const cam = this.camY + this.off;
    for (let i = this.bodies.length - 1; i >= 0; i--) { const b = this.bodies[i]; const dx = sx - b.x, dy = sy + cam - b.y; if (dx * dx + dy * dy <= b.r * b.r) return b; }
    return null;
  }
  bindInput() {
    const h = this.host; let sy = 0, sx = 0, so = 0, st = 0, moved = false, pid = null;
    h.addEventListener('pointerdown', e => { pid = e.pointerId; sx = e.clientX; sy = e.clientY; so = this.off; st = performance.now(); moved = false; this.dragging = true; h.classList.add('dragging'); this.wake(); });
    h.addEventListener('pointermove', e => {
      if (!this.dragging || e.pointerId !== pid) return;
      const dy = e.clientY - sy; if (Math.abs(dy) > 6 || Math.abs(e.clientX - sx) > 6) { if (!moved) { try { h.setPointerCapture(pid); } catch (_) { } } moved = true; }
      let off = so - dy; if (off < 0) off = off * .5; const maxOff = this.baseCam() - this.camY; if (off > maxOff) off = maxOff + (off - maxOff) * .3;
      this.off = off; this.wake();
    });
    const end = e => {
      if (!this.dragging || (e && e.pointerId !== pid)) return;
      this.dragging = false; h.classList.remove('dragging');
      if (!moved && performance.now() - st < 600) {
        const rc = h.getBoundingClientRect(); const b = this.hit(e.clientX - rc.left, e.clientY - rc.top);
        if (b) { b.pulse = performance.now(); this.wake(); setTimeout(() => this.opts.onTap(b.ball), 140); }
      } else if (this.off < -70 && this.opts.onPull) { this.opts.onPull(); }
      this.wake();
    };
    h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
    h.addEventListener('wheel', e => { e.preventDefault(); const maxOff = this.baseCam() - this.camY; this.off = clamp(this.off + e.deltaY, 0, Math.max(0, maxOff)); this.wake(); }, { passive: false });
  }
}

/* ---------- トースト ---------- */
let toastT;
function toast(text, icon) {

  t.innerHTML = (icon === 'sun' ? IC.sun : icon === 'check' ? IC.check : '') + '<span>' + esc(text) + '</span>';
  t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3400);

/* ---------- レイヤー（シート・ページ） ---------- */
const layers = [];
function openLayer(kind, build, opts = {}) {
  const el = document.createElement('div'); el.className = 'layer';
  const L = { el, kind, refresh: null, onClose: opts.onClose, timers: [] };
  if (kind !== 'page') el.innerHTML = '<div class="scrim" data-act="close"></div>';
  const inner = document.createElement('div');
  inner.className = { sheet: 'sheet', page: 'page', composer: 'composer', iap: 'iap', modal: 'modal' }[kind];
  el.appendChild(inner); L.inner = inner;
  $('#layers').appendChild(el); layers.push(L);
  build(L, inner);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  return L;
}
function closeLayer(L = layers[layers.length - 1], instant) {
  if (!L) return;
  const i = layers.indexOf(L); if (i >= 0) layers.splice(i, 1);
  L.timers.forEach(clearInterval); L.closed = true;
  L.el.classList.remove('in');

}

/* =====================================================================
   玉をひらく

function postCard(p, morning, extra = '') {

/* =====================================================================

        if (bottomKey === k) return; bottomKey = k;
        bottom.innerHTML = `<div class="peekbar"><span class="eye">${IC.eye}</span><span class="grow small muted">ふたりには、誰が何人のぞいているか分かりません</span>
          ${fb && fb.owner !== me() && !inRoom(r) ? `<button class="btn small hydra" data-act="startTalk" data-id="${fb.id}">${esc(user(fb.owner).name)}に話しかける</button>` : ''}</div>`;
        return;
      }
      const paused = isPaused(r), L2 = activeLock(r);
      const k = paused ? 'paused' : 'open' + (L2 ? L2.id : '');
      if (bottomKey === k) { updateLockState(); return; } bottomKey = k;
      if (paused) {
        bottom.innerHTML = `<div class="paused">最後の会話から3日が過ぎたので、このトークは休んでいます。<br>また話すには、${esc(user(partner(r)).name)}の玉から話しかけてください。<div style="margin-top:12px"><button class="btn small ghost" data-act="profile" data-id="${partner(r)}">${esc(user(partner(r)).name)}の玉をさがす</button></div></div>`;
        return;
      }
      const draft = bottom.querySelector('textarea')?.value || '';
      bottom.innerHTML = `${L2 ? `<div class="lockstate">${lockSvg(L2.kind, 'i')}<span class="ls-text"></span></div>` : ''}
        <form class="inputbar"><button type="button" class="iconbtn" data-act="lockPick" data-id="${r.id}" aria-label="錠をかける">${lockSvg(L2 ? L2.kind : 'normal', '')}</button>
        <textarea rows="1" placeholder="メッセージ" aria-label="メッセージ">${esc(draft)}</textarea><button class="iconbtn send" aria-label="送信">${IC.send}</button></form>`;
      const f = bottom.querySelector('form'), ta = f.querySelector('textarea');
      ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(120, ta.scrollHeight) + 'px'; });
      ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); f.requestSubmit(); } });
      f.addEventListener('submit', async e => { e.preventDefault(); const v = ta.value.trim(); if (!v) return; ta.value = ''; ta.style.height = ''; await sendMessage(roomById(roomId), v); refresh(); });
      updateLockState();
    };
    const updateLockState = () => {
      const r = roomById(roomId), L2 = activeLock(r), el = bottom.querySelector('.ls-text');
      if (L2 && el) el.textContent = `${CONFIG.locks[L2.kind].name}をかけています　のこり ${dur(L2.exp - now())}`;
      if (!L2 && el) { bottomKey = ''; renderBottom(); }
    };
    L.refresh = () => {
      const r = roomById(roomId); if (!r) return;
      const nearBottom = bodyEl.scrollHeight - bodyEl.scrollTop - bodyEl.clientHeight < 120;
      if (!peek) acct().read[r.id] = Math.max(acct().read[r.id] || 0, now());
      talkEl.innerHTML = renderTalk(r, peek, fromBallId, seen, first);
      allMsgs(r).forEach(m => seen.add(m.id));
      renderHead(); renderBottom();
      if (first || nearBottom) bodyEl.scrollTop = bodyEl.scrollHeight;
      first = false;
    };
    L.refresh();
    if (!peek) { save(); updateDot(); }
    L.timers.push(setInterval(() => { if (!peek) { if (isPaused(roomById(roomId))) renderBottom(); else updateLockState(); } }, 1000));
    // のぞいている間も、ふたりの会話は続いていく
    if (peek && !LIVE) L.timers.push(setInterval(() => {
      const r = roomById(roomId); if (!r.live || !r.live.length) return;
      const [w, text] = r.live.shift(); const Lk = activeLock(r);
      lastSeg(r).messages.push({ id: uid('m'), from: r[w], text, at: now(), lock: Lk ? Lk.id : null });
      save(); L.refresh();
    }, 4800));
  });
}
function renderTalk(r, peek, fromBallId, seen, first) {
  let segs = r.segments, cut = false;
  if (peek) {
    let idx = fromBallId ? r.segments.findIndex(s => s.ballId === fromBallId) : r.segments.length - 1;
    if (idx < 0) idx = r.segments.length - 1;
    const limit = r.segments[idx].at - CONFIG.peekBackMs;
    let i0 = idx; while (i0 > 0 && r.segments[i0 - 1].at >= limit) i0--;
    cut = i0 > 0; segs = r.segments.slice(i0);
  }
  let h = cut ? `<div class="limit-note">これより前の会話は、この玉からは見られません</div>` : '';
  const side = id => peek ? (id === r.a ? 'l' : 'r') : (id === me() ? 'r' : 'l');
  for (const s of segs) {
    const b = ballById(s.ballId);
    const gc = b ? CONFIG.gender[user(b.owner).gender].color : 'var(--faint)';
    h += `<div class="seg"><span class="w"><i style="--gc:${gc};background:${b && b.rainbow ? 'conic-gradient(#f6c4d4,#f7e3b5,#c9ecd3,#bfe3f2,#d4cdf2,#f6c4d4)' : b ? `radial-gradient(circle at 35% 30%,${lighten(b.color, .6)},${b.color})` : '#ddd'}"></i>${b ? (b.type === 'mood' ? '「' + esc(b.text) + '」' : esc(ballLabel(b))) : 'きっかけの玉'}</span><span>${md(s.at)} ${hm(s.at)}　${esc(user(s.starter).name)}が話しかけた</span></div>`;
    const events = [...s.messages.map(m => ({ t: m.at, m })), ...s.locks.map(l => ({ t: l.at, l, lock: true }))].sort((x, y) => x.t - y.t || (x.lock ? -1 : 1));
    let block = null, opened = null, prevFrom = null;
    const flushBlock = () => {
      if (block) { const lk = lockById(r, block.lockId); h += lockBlockHtml(r, lk, block.n); block = null; }
      if (opened) { h += `<div class="opened"><div class="oh">${keySvg('normal', 'i')}鍵で開けた会話　あなたにだけ見えています</div>${opened.html}</div>`; opened = null; }
    };
    for (const e of events) {
      if (e.lock) {
        if (!peek) { flushBlock(); h += `<div class="lockline">${lockSvg(e.l.kind, 'i')}${esc(user(e.l.by).name)}が${CONFIG.locks[e.l.kind].name}をかけました　${hm(e.l.at)}から${durLabel(CONFIG.locks[e.l.kind].durationMs)}</div>`; }
        continue;
      }
      const m = e.m;
      if (peek && m.lock && !isUnlocked(m.lock)) {
        if (opened) flushBlock();
        if (block && block.lockId !== m.lock) flushBlock();
        block = block || { lockId: m.lock, n: 0 }; block.n += (m.hiddenN || 1); prevFrom = null; continue;
      }
      if (peek && m.lock && isUnlocked(m.lock)) {
        if (block) flushBlock();
        if (opened && opened.lockId !== m.lock) flushBlock();
        opened = opened || { lockId: m.lock, html: '' };
        opened.html += msgHtml(r, m, side(m.from), peek, prevFrom, seen, first); prevFrom = m.from; continue;
      }
      if (block || opened) { flushBlock(); prevFrom = null; }
      h += msgHtml(r, m, side(m.from), peek, prevFrom, seen, first); prevFrom = m.from;
    }
    flushBlock();
  }
  if (typingRooms.has(r.id)) h += `<div class="typing" aria-label="入力中"><i></i><i></i><i></i></div>`;
  return h;
}
function msgHtml(r, m, side, peek, prevFrom, seen, first) {
  const isNew = !first && !seen.has(m.id);
  const who = peek && prevFrom !== m.from ? `<div class="who" style="text-align:${side === 'r' ? 'right' : 'left'}">${esc(user(m.from).name)}</div>` : '';
  return `${who ? `<div style="align-self:${side === 'r' ? 'flex-end' : 'flex-start'}">${who}</div>` : ''}<div class="msg ${side}${peek ? ' peek' : ''}${m.lock ? ' locked' : ''}${isNew ? ' new' : ''}">
    <div class="bub">${esc(m.text)}</div>${!peek && m.lock ? smallLock : ''}<span class="tm">${hm(m.at)}</span></div>`;
}
function lockBlockHtml(r, lk, n) {
  const kind = lk ? lk.kind : 'normal', L = CONFIG.locks[kind];
  const possible = Object.keys(CONFIG.keys).filter(k => canOpen(k, kind));
  const owned = possible.filter(k => acct().items['key_' + k] > 0);
  let action;
  if (!possible.length) action = `<span class="ls">いまある鍵では開けられません</span>`;
  else action = `<button class="btn small ${owned.length ? 'hydra' : 'ghost'}" data-act="keyPick" data-room="${r.id}" data-lock="${lk.id}">${owned.length ? '鍵で開ける' : '鍵を手に入れる'}</button>`;
  return `<div class="lockblock"><span class="lic">${lockSvg(kind)}</span><span class="grow" style="min-width:0"><span class="lt">${L.name}　メッセージ${n}通</span>
    <span class="ls" style="display:block">${possible.length ? CONFIG.keys[possible[0]].name + (possible.length > 1 ? '以上' : '') + 'で開けられます' : '高級錠は、だれにも開けられない'}</span></span>${possible.length ? action : ''}</div>`;
}

    const body = inner.querySelector('.cbody'), prev = inner.querySelector('.preview'), fields = inner.querySelector('.cfields');
    const ballObj = () => ({ id: 'preview', owner: me(), type: c.type, text: c.type === 'mood' ? (c.text || '…') : '', color: c.color, pt: c.pt, rainbow: c.rainbow });
    const cost = () => (c.pt + (c.rainbow ? CONFIG.rainbowCost : 0)) * c.count;
    const pool = () => c.type === 'mood' ? acct().moodPt : acct().postPt;
    const drawPrev = () => {
      prev.querySelector('canvas')?.remove();
      const cv = ballCanvas(ballObj(), CONFIG.radius(c.pt), { lock: false }); cv.style.position = 'absolute'; cv.style.left = '50%'; cv.style.top = '50%'; cv.style.transform = 'translate(-50%,-50%)';
      prev.appendChild(cv);
      const cn = prev.querySelector('.cnt'); cn.hidden = c.count < 1.5; cn.textContent = '× ' + c.count;
    };
    const summary = () => {
      const s = fields.querySelector('.summary'), btn = fields.querySelector('[data-throw]'), short = cost() > pool();
      s.innerHTML = `<span>${c.type === 'mood' ? '気分玉' : '投稿玉'}ポイント ${pool()}pt から</span><b>${cost()}pt</b>`;
      const ready = c.type === 'mood' ? chars(c.text) > 0 : (c.postId !== 'new' || c.newText.trim());
      btn.disabled = short || !ready; btn.textContent = short ? 'ポイントが足りません' : c.count > 1 ? `${c.count}個 投げる` : '投げる';
      fields.querySelector('.buy-link').hidden = !short;
      fields.querySelector('.ptv').textContent = c.pt + 'pt';
    };
    const renderFields = () => {
      inner.querySelectorAll('[data-ct]').forEach(b => b.classList.toggle('on', b.dataset.ct === c.type));
      const posts = myPosts();
      fields.innerHTML = `
        ${c.type === 'mood' ? `<input class="wordin" placeholder="いまの気分を5文字で" value="${esc(c.text)}" aria-label="気分（5文字まで）"><div class="small muted" style="text-align:right;margin-top:6px"><span class="wc">${chars(c.text)}</span> / ${CONFIG.moodMaxLen}</div>`
        : `<div class="pickpost">${posts.slice(0, 4).map(p => `<button data-pp="${p.id}" class="${c.postId === p.id ? 'on' : ''}">${esc(p.text)}<span class="muted small" style="display:block">${ago(p.at)}</span></button>`).join('')}
           <button data-pp="new" class="${c.postId === 'new' ? 'on' : ''}">新しく投稿して、玉にする</button>
           ${c.postId === 'new' ? `<textarea class="plain nt" rows="3" placeholder="いまのこと" maxlength="280">${esc(c.newText)}</textarea>` : ''}</div>
           <p class="small muted" style="margin:8px 2px 0">投稿するだけならポイントは使いません。ワールドに玉として投げるときだけ使います。</p>`}
        <div class="field"><label><span>玉の色</span><span class="muted">内側の環は性別の色（${CONFIG.gender[user(me()).gender].label}）</span></label>
          <div class="swatches">${CONFIG.palette.map(col => `<button class="sw ${!c.rainbow && c.color === col ? 'on' : ''}" data-sw="${col}" style="background:radial-gradient(circle at 35% 30%,${lighten(col, .6)},${col})" aria-label="色 ${col}"></button>`).join('')}
            <button class="sw rb ${c.rainbow ? 'on' : ''}" data-rb aria-label="虹色"></button></div></div>
        <div class="toggle" style="margin-top:12px"><span><span style="font-weight:500;font-size:14px">虹色にする</span><span class="small muted" style="display:block">1個につき +${CONFIG.rainbowCost}pt。無料の100ptだけでは作れません</span></span><button class="switch ${c.rainbow ? 'on' : ''}" data-rb role="switch" aria-checked="${c.rainbow}" aria-label="虹色にする"></button></div>
        <div class="field"><label><span>1個あたりのポイント　大きいほど見つけてもらいやすい</span><b class="ptv" style="font-weight:500;color:var(--ink)">${c.pt}pt</b></label>
          <input type="range" min="1" max="${CONFIG.maxPtPerBall}" value="${c.pt}" class="ptr" aria-label="1個あたりのポイント"></div>
        <div class="field" style="display:flex;justify-content:space-between;align-items:center"><span class="small" style="color:var(--ink-2)">投げる数</span>
          <span class="stepper"><button data-cnt="-1" aria-label="減らす">−</button><b>${c.count}</b><button data-cnt="1" aria-label="増やす">＋</button></span></div>
        <div class="summary"></div>
        <button class="btn hydra block" data-throw>投げる</button>
        <p class="small" style="text-align:center;margin:10px 0 0"><button class="buy-link" data-act="shop" style="color:var(--hydra-d);text-decoration:underline" hidden>ポイントを購入する</button></p>
        <p class="small muted" style="text-align:center;margin:8px 0 0">上の玉を下へはじいても投げられます</p>`;
      const wi = fields.querySelector('.wordin');
      if (wi) wi.addEventListener('input', () => { let v = [...wi.value]; if (v.length > CONFIG.moodMaxLen) { v = v.slice(0, CONFIG.moodMaxLen); wi.value = v.join(''); } c.text = wi.value.trim(); fields.querySelector('.wc').textContent = chars(c.text); drawPrev(); summary(); });
      const nt = fields.querySelector('.nt'); if (nt) nt.addEventListener('input', () => { c.newText = nt.value; summary(); });
      fields.querySelectorAll('[data-pp]').forEach(b => b.onclick = () => { c.postId = b.dataset.pp; renderFields(); });
      fields.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => { c.color = b.dataset.sw; c.rainbow = false; renderFields(); });
      fields.querySelectorAll('[data-rb]').forEach(b => b.onclick = () => { c.rainbow = !c.rainbow; renderFields(); });
      fields.querySelector('.ptr').addEventListener('input', e => { c.pt = +e.target.value; drawPrev(); summary(); });
      fields.querySelectorAll('[data-cnt]').forEach(b => b.onclick = () => { c.count = clamp(c.count + +b.dataset.cnt, 1, CONFIG.maxBallsPerThrow); renderFields(); });
      fields.querySelector('[data-throw]').onclick = go;
      drawPrev(); summary();
    };
    inner.querySelectorAll('[data-ct]').forEach(b => b.onclick = () => { c.type = b.dataset.ct; renderFields(); });
    L.refresh = () => { if (!inner.querySelector('.wordin:focus,.nt:focus')) summary(); };
    async function go() {
      if (c.type === 'mood' && !chars(c.text)) return;
      let postId = null;
      if (c.type === 'post') {
        if (c.postId === 'new') { if (!c.newText.trim()) return; postId = uid('p'); }
        else postId = c.postId;
      }
      if (cost() > pool()) { toast('ポイントが足りません'); return; }
      if (postId && c.postId === 'new') {
        if (LIVE) {const {data,error}=await SB.from('posts').insert({owner:me(),body:c.newText.trim()}).select().single();
          if(error){toast(error.message);return;}postId=data.id;await remoteSync();}
        else S.posts.push({ id:postId,owner:me(),text:c.newText.trim(),at:now(),likes:[],likeBase:0 });
      }
      const made = await throwBalls({ type: c.type, text: c.text, postId, color: c.color, pt: c.pt, count: c.count, rainbow: c.rainbow });
      if (!made) return;
      closeLayer(L); refresh();
      flyBalls(made);
    }
    // プレビューの玉を下へはじく
    let sy = null;
    prev.addEventListener('pointerdown', e => { sy = e.clientY; prev.setPointerCapture(e.pointerId); });
    prev.addEventListener('pointermove', e => { if (sy == null) return; const d = Math.max(0, e.clientY - sy); const cv = prev.querySelector('canvas'); if (cv) cv.style.transform = `translate(-50%,calc(-50% + ${Math.min(d, 60) * .6}px))`; });
    prev.addEventListener('pointerup', e => { if (sy == null) return; const d = e.clientY - sy; sy = null; const cv = prev.querySelector('canvas'); if (cv) cv.style.transform = 'translate(-50%,-50%)'; if (d > 50) { const btn = fields.querySelector('[data-throw]'); if (!btn.disabled) go(); else toast(btn.textContent === '投げる' ? (c.type === 'mood' ? '気分を書いてから投げてね' : '投稿を選んでから投げてね') : btn.textContent); } });
    renderFields();
  });
}
/* 自分の玉は、積もらずにシュッと画面の外へ */
function flyBalls(balls) {
  const ph = $('#phone'), W = ph.clientWidth, Hh = ph.clientHeight;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  balls.forEach((b, i) => {
    const r = CONFIG.radius(b.pt); const make = () => { const cv = ballCanvas(b, r, { lock: false }); cv.className = 'flyer'; ph.appendChild(cv); return cv; };
    const x = W / 2 + (balls.length > 1 ? (i - (balls.length - 1) / 2) * Math.min(26, 200 / balls.length) : 0);
    const y0 = Hh * .2;
    const delay = i * 120;
    [0, 1, 2].forEach(ghost => {
      const el = make(); const s = parseFloat(el.style.width);
      const tx = x - s / 2, ty = y0 - s / 2;
      el.style.opacity = 0;
      const kf = [
        { transform: `translate(${tx}px,${ty}px) scale(.3)`, opacity: 0, offset: 0 },
        { transform: `translate(${tx}px,${ty - 16}px) scale(1.06)`, opacity: ghost ? 0 : 1, offset: .28, easing: 'ease-out' },
        { transform: `translate(${tx}px,${ty - 22}px) scale(1,1.02)`, opacity: ghost ? .35 / ghost : 1, offset: .4, easing: 'cubic-bezier(.7,0,.95,.45)' },
        { transform: `translate(${tx}px,${Hh + s * .2}px) scale(.8,1.5)`, opacity: ghost ? .1 : .9, offset: 1 },
      ];
      const an = el.animate(kf, { duration: reduce ? 400 : 820, delay: delay + ghost * 34, fill: 'forwards' });
      an.onfinish = () => el.remove();
    });
  });
  setTimeout(() => toast('ワールドへ投げました。更新すると、上から降ってきます'), 700 + balls.length * 120);
}

  tab = t; closeAll();

  ['world', 'chats', 'follow', 'me'].forEach(k => $('#scr-' + k).classList.toggle('on', k === t));

  timeReset: () => { S.timeOffset = 0; save(); refresh(); mainWorld.build(false); followDirty = true; toast('現在の時刻に戻しました'); },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(t && !signedIn() && ['startTalk','like','follow','lockPick','useLock','keyPick','useKey','buy','shop','editProfile','postNew','throwPost'].includes(t.dataset.act)){
    e.preventDefault();promptAuth(t.dataset.act==='startTalk'?'話しかける':t.dataset.act==='postNew'?'投稿する':t.dataset.act==='like'?'いいねする':t.dataset.act==='follow'?'フォローする':'この操作');return;
  }
  if (t && ACT[t.dataset.act]) { e.preventDefault(); ACT[t.dataset.act](t.dataset, t); return; }
  const tb = e.target.closest('nav.tabs [data-tab]'); if (tb) setTab(tb.dataset.tab);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && layers.length) closeLayer(); });

// Live snapshot is the only source of truth for shared messages.
function dayStartUTC(){const t=new Date(Date.now()+9*3600000-4*3600000);t.setUTCHours(0,0,0,0);return t.getTime()-9*3600000+4*3600000;}
async function remoteSync(){
 if(!SB)return;
 if(loadingRemote){queuedRemote=true;return;}
 loadingRemote=true;
 try{
   const [profiles,balls,posts,rooms,segments,messages,likes,follows,locks,inventory,credits,unlocks]=await Promise.all([
     SB.from('profiles').select('*').limit(500),
     SB.from('balls').select('*').order('created_at',{ascending:false}).limit(180),
     SB.from('posts').select('*').order('created_at',{ascending:false}).limit(200),
     SB.from('rooms').select('*').order('last_message_at',{ascending:false}).limit(150),
     SB.from('segments').select('*').order('created_at',{ascending:false}).limit(400),
     SB.from('messages').select('*').order('created_at',{ascending:false}).limit(1200),
     SB.from('post_likes').select('post_id,user_id').limit(3000),
     signedIn()?SB.from('follows').select('followee').eq('follower',authUid).limit(300):Promise.resolve({data:[]}),
     SB.from('chat_locks').select('*').order('created_at',{ascending:false}).limit(600),
     signedIn()?SB.from('inventory').select('item_id,qty').eq('user_id',authUid):Promise.resolve({data:[]}),
     signedIn()?SB.from('point_credits').select('kind,balance').eq('user_id',authUid):Promise.resolve({data:[]}),
     signedIn()?SB.from('chat_unlocks').select('lock_id').eq('user_id',authUid):Promise.resolve({data:[]})
   ]);
   const errors=[profiles,balls,posts,rooms,segments,messages,likes,follows,locks,inventory,credits,unlocks].filter(x=>x.error).map(x=>x.error.message);
   if(errors.length)throw new Error(errors.join(' / '));
   const myFollows=(follows.data||[]).map(f=>f.followee);
   const users={};(profiles.data||[]).forEach(p=>users[p.id]={id:p.id,name:p.name,handle:p.name+'_'+p.id.slice(0,4),gender:p.gender||'o',hue:hash(p.id)%360,bio:p.bio||'',isBot:!!p.is_bot,following:p.id===authUid?myFollows:[]});
   if(!users[authUid]){users[authUid]={id:authUid,name:signedIn()?'あなた':'ゲスト',handle:'guest',gender:'o',hue:190,bio:'',following:myFollows};}
   const postList=(posts.data||[]).map(p=>({id:p.id,owner:p.owner,text:p.body,at:Date.parse(p.created_at),likes:(likes.data||[]).filter(l=>l.post_id===p.id).map(l=>l.user_id),likeBase:0}));
   const ballList=(balls.data||[]).map(b=>({id:b.id,owner:b.owner,type:b.kind,text:b.text||'',postId:b.post_id,color:b.color,pt:b.points,rainbow:!!b.rainbow,at:Date.parse(b.created_at)}));
   const roomList=(rooms.data||[]).map(r=>({id:r.id,a:r.user_a,b:r.user_b,segments:[],live:[],lastMessageAt:Date.parse(r.last_message_at)}));
   const byRoom=new Map(roomList.map(r=>[r.id,r]));
   const bySeg=new Map();
   (segments.data||[]).sort((a,b)=>Date.parse(a.created_at)-Date.parse(b.created_at)).forEach(seg=>{
     const r=byRoom.get(seg.room_id);if(!r)return;
     const s={id:seg.id,ballId:seg.ball_id,starter:seg.started_by,at:Date.parse(seg.created_at),messages:[],locks:[]};r.segments.push(s);bySeg.set(s.id,s);
   });
   const unlockedIds=new Set((unlocks.data||[]).map(x=>x.lock_id));
   (locks.data||[]).sort((a,b)=>Date.parse(a.created_at)-Date.parse(b.created_at)).forEach(l=>{
     const seg=bySeg.get(l.segment_id);if(!seg)return;
     seg.locks.push({id:l.id,kind:l.kind,by:l.owner,at:Date.parse(l.created_at),exp:Date.parse(l.expires_at),messageCount:l.message_count});
   });
   const visibleCounts={};
   (messages.data||[]).sort((a,b)=>Date.parse(a.created_at)-Date.parse(b.created_at)).forEach(m=>{
     const seg=bySeg.get(m.segment_id);if(seg){seg.messages.push({id:m.id,from:m.sender_id,text:m.body,at:Date.parse(m.created_at),lock:m.lock_id});if(m.lock_id)visibleCounts[m.lock_id]=(visibleCounts[m.lock_id]||0)+1;}
   });
   // Hidden bodies are never returned by the database. Render a count-only placeholder.
   for(const r of roomList)for(const seg of r.segments)for(const lk of seg.locks){
     if(r.a!==authUid&&r.b!==authUid&&!unlockedIds.has(lk.id)){
       const hidden=Math.max(0,(lk.messageCount||0)-(visibleCounts[lk.id]||0));
       if(hidden)seg.messages.push({id:'hidden_'+lk.id,from:r.a,text:'',at:lk.at+1,lock:lk.id,hiddenN:hidden});
     }
     seg.messages.sort((a,b)=>a.at-b.at);
   }
   const k=dayStartUTC(), mine=ballList.filter(b=>b.owner===authUid&&b.at>=k);
   const moodUsed=mine.filter(b=>b.type==='mood').reduce((n,b)=>n+b.pt+(b.rainbow?100:0),0),postUsed=mine.filter(b=>b.type==='post').reduce((n,b)=>n+b.pt+(b.rainbow?100:0),0);
   const sendsUsed=(segments.data||[]).filter(x=>x.started_by===authUid&&Date.parse(x.created_at)>=k).length;
   const prior=S?.acct?.[authUid];const account=newAcct();
   const creditMap=Object.fromEntries((credits.data||[]).map(c=>[c.kind,c.balance]));
   account.moodPt=Math.max(0,100-moodUsed)+(creditMap.mood||0);
   account.postPt=Math.max(0,100-postUsed)+(creditMap.post||0);
   for(const it of (inventory.data||[]))account.items[it.item_id]=it.qty;
   account.unlocked=[...unlockedIds];
   account.sends=Math.max(0,15-sendsUsed);account.read=prior?.read||{};
   S={v:1,timeOffset:0,current:authUid,accounts:[authUid],users,acct:{[authUid]:account},balls:ballList,posts:postList,rooms:roomList.filter(r=>r.segments.length),hintDone:true};
   const emptyGuest=$('#emptyGuest'); if(emptyGuest)emptyGuest.hidden=ballList.length!==0;
   if(mainWorld){refresh();mainWorld.build(false);followDirty=true;}
 }catch(e){console.error('remoteSync',e);toast('同期エラー: '+e.message);}
 finally{loadingRemote=false;if(queuedRemote){queuedRemote=false;setTimeout(remoteSync,150);}}
}
let syncDebounce;
function subscribeLive(){
 SB.channel('tamacha-live').on('postgres_changes',{event:'*',schema:'public',table:'balls'},()=>scheduleSync())
 .on('postgres_changes',{event:'*',schema:'public',table:'posts'},()=>scheduleSync())
 .on('postgres_changes',{event:'*',schema:'public',table:'rooms'},()=>scheduleSync())
 .on('postgres_changes',{event:'*',schema:'public',table:'segments'},()=>scheduleSync())
 .on('postgres_changes',{event:'*',schema:'public',table:'messages'},()=>scheduleSync())
 .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},()=>scheduleSync())
 .on('postgres_changes',{event:'*',schema:'public',table:'post_likes'},()=>scheduleSync())
 .on('postgres_changes',{event:'*',schema:'public',table:'follows'},()=>scheduleSync())
 .on('postgres_changes',{event:'*',schema:'public',table:'chat_locks'},()=>scheduleSync())
 .on('postgres_changes',{event:'*',schema:'public',table:'chat_unlocks'},()=>scheduleSync()).subscribe();
}
function scheduleSync(){clearTimeout(syncDebounce);syncDebounce=setTimeout(remoteSync,450);}
let startedUI=false;
async function enterLive(session){
 authUid=session.user.id;
 const {data,error}=await SB.from('profiles').select('id').eq('id',authUid).maybeSingle();
 if(error){$('#authError').textContent=error.message;return;}
 if(!data){const name=localStorage.getItem('tamacha_name_'+authUid)||(session.user.email||'ユーザー').split('@')[0];
   const {error:e}=await SB.from('profiles').insert({id:authUid,name:name.slice(0,25)||'ユーザー',gender:'o'});
   if(e){$('#authError').textContent=e.message;return;}
 }
 try {await SB.rpc('ensure_morning_ball');} catch(e){console.warn('morning ball',e);} 
 await remoteSync();
 if(!S){$('#authError').textContent='データを読み込めませんでした';return;}
 $('#authGate').hidden=true;$('#guestEntry').hidden=signedIn();document.body.classList.add('live');
 if(!startedUI){
  startedUI=true;
  mainWorld=new World($('#world-main'),{filter:()=>true,pullEl:$('#pull-main'),backEl:$('[data-act="worldTop"][data-w="main"]'),onTap:b=>openBall(b.id),onPull:()=>reloadWorld(),onBuilt:n=>$('#worldCount').textContent=`公開の玉　${n}`});
  followWorld=new World($('#world-follow'),{filter:b=>user(me()).following.includes(b.owner),pullEl:$('#pull-follow'),backEl:$('[data-act="worldTop"][data-w="follow"]'),onTap:b=>openBall(b.id),onPull:()=>reloadWorld(followWorld,'[data-act="reloadFollow"]')});
  worlds=[mainWorld,followWorld];mainWorld.setVisible(true);mainWorld.build(true);$('#hint').hidden=true;refresh();
  if(document.fonts)document.fonts.ready.then(()=>{fontGen++;spriteCache.clear();worlds.forEach(w=>w.wake());});
  subscribeLive();setInterval(remoteSync,12000);
  // A new Tokyo day starts at 04:00; refreshing or leaving the app open both work.
  let morningDay=dayKey(Date.now());
  setInterval(async()=>{const k=dayKey(Date.now());if(k!==morningDay){morningDay=k;if(signedIn())await SB.rpc('ensure_morning_ball');await remoteSync();}},30000);
 }else{refresh();if(mainWorld)mainWorld.build(false);}
}
async function enterGuest(){
 authUid=GUEST_ID;
 await remoteSync();
 $('#authGate').hidden=true;$('#guestEntry').hidden=false;
 document.body.classList.add('live');
 if(!S){$('#guestEntry').textContent='読み込みに失敗しました。再読み込みしてください';return;}
 if(!startedUI){
  startedUI=true;
  mainWorld=new World($('#world-main'),{filter:()=>true,pullEl:$('#pull-main'),backEl:$('[data-act="worldTop"][data-w="main"]'),onTap:b=>openBall(b.id),onPull:()=>reloadWorld(),onBuilt:n=>$('#worldCount').textContent=`公開の玉　${n}`});
  followWorld=new World($('#world-follow'),{filter:b=>user(me()).following.includes(b.owner),pullEl:$('#pull-follow'),backEl:$('[data-act="worldTop"][data-w="follow"]'),onTap:b=>openBall(b.id),onPull:()=>reloadWorld(followWorld,'[data-act="reloadFollow"]')});
  worlds=[mainWorld,followWorld];mainWorld.setVisible(true);mainWorld.build(true);$('#hint').hidden=true;refresh();
  if(document.fonts)document.fonts.ready.then(()=>{fontGen++;spriteCache.clear();worlds.forEach(w=>w.wake());});
  subscribeLive();setInterval(remoteSync,12000);
 }
}
async function boot(){
 try{
  if(!window.supabase){$('#authError').textContent='通信ライブラリを読み込めません。再読み込みしてください。';return;}
  SB=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  let signup=true;
  $('#authSwitch').onclick=()=>{signup=!signup;$('#signupFields').hidden=!signup;$('#authSubmit').textContent=signup?'新規登録':'ログイン';$('#authSwitch').textContent=signup?'ログインはこちら':'新規登録はこちら';$('#authError').textContent='';};
  $('#authForm').onsubmit=async e=>{
    e.preventDefault();$('#authError').textContent='';const btn=$('#authSubmit');btn.disabled=true;btn.textContent='接続中…';
    try{const f=new FormData(e.target),email=String(f.get('email')).trim(),password=String(f.get('password'));
      if(signup){const name=String(f.get('name')||'').trim();if(!name)throw Error('表示名を入力してください');
        const {data,error}=await SB.auth.signUp({email,password,options:{emailRedirectTo:'https://tamacha.vercel.app/'}});if(error)throw error;
        if(data.user)localStorage.setItem('tamacha_name_'+data.user.id,name);
        if(data.session)await enterLive(data.session);
        else $('#authError').textContent='確認メールを送信しました。届いたリンクを開いてください。リンクが開かない場合はSupabaseのURL設定を確認してください。';
      }else{const {data,error}=await SB.auth.signInWithPassword({email,password});if(error)throw error;await enterLive(data.session);}
    }catch(err){$('#authError').textContent=err.message;}finally{btn.disabled=false;btn.textContent=signup?'新規登録':'ログイン';}
  };
  $('#authClose').onclick=()=>{$('#authGate').hidden=true;};
  const {data:{session}}=await SB.auth.getSession();
  if(session)await enterLive(session);else await enterGuest();
  // Supabase redirects authentication errors in the URL hash.
  const params=new URLSearchParams(location.hash.replace(/^#/,''));
  if(params.has('error_description')){$('#authError').textContent=params.get('error_description');$('#authGate').hidden=false;}
 }catch(e){console.error(e);$('#authError').textContent=e.message;}
}
boot();;
